<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bron — панель заведения</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="admin">
    <aside class="sidebar">
      <a class="logo" href="/admin">
        <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="6"/><path d="M8 20h8M12 16v4"/></svg></span>
        Bron
      </a>
      <div>
        <div class="sb-label sb-section">Заведения</div>
        <div class="venues" id="venues"></div>
      </div>
      <div class="sb-section">
        <div class="sb-label">Меню</div>
        <nav class="sb-nav">
          <a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><circle cx="15" cy="15" r="2"/></svg>Зал</a>
          <a href="#bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Брони</a>
          <a href="/" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Сайт для гостей</a>
        </nav>
      </div>
      <div class="sb-foot">
        <div class="guest" style="margin:0">
          <div class="av">Х</div>
          <div><b>Хостес</b><small>Смена открыта</small></div>
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-head">
        <div>
          <span class="eyebrow"><span class="live-dot"></span>Онлайн</span>
          <h1 id="title">Зал</h1>
        </div>
        <div class="clock" id="clock"></div>
      </div>

      <div class="stats">
        <div class="stat free"><div class="top">Свободно<i></i></div><b id="stFree">–</b><div class="bar"><i id="bFree" style="background:var(--free-2)"></i></div></div>
        <div class="stat booked"><div class="top">Забронировано<i></i></div><b id="stBooked">–</b><div class="bar"><i id="bBooked" style="background:var(--booked)"></i></div></div>
        <div class="stat seated"><div class="top">Гости за столом<i></i></div><b id="stSeated">–</b><div class="bar"><i id="bSeated" style="background:var(--seated)"></i></div></div>
        <div class="stat"><div class="top">Загрузка зала</div><b id="stLoad">–</b><div class="bar"><i id="bLoadS" style="background:var(--seated)"></i><i id="bLoadB" style="background:var(--booked)"></i></div></div>
      </div>

      <div class="admin-grid">
        <section class="card hall-card">
          <div class="hall-head">
            <div>
              <h3>Схема зала</h3>
              <div class="sub">Красным — брони на ближайшие 2 часа</div>
            </div>
            <div class="legend">
              <span class="free"><i></i>Свободен</span>
              <span class="booked"><i></i>Забронирован</span>
              <span class="seated"><i></i>Гости за столом</span>
            </div>
          </div>
          <div id="hall"></div>
        </section>

        <div class="admin-side">
          <div class="card" id="panel"></div>
          <div class="card" id="bookings">
            <h3>Брони на сегодня</h3>
            <div class="tabs" id="tabs"></div>
            <ul class="blist" id="list"></ul>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/hall.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const STATUS = { booked: 'Ожидается', seated: 'За столом', done: 'Ушли', cancelled: 'Отменена' };
    const TABS = [
      ['all', 'Все'],
      ['booked', 'Ждём'],
      ['seated', 'Сидят'],
      ['closed', 'Закрыты'],
    ];
    let restaurants = [];
    let current = null;
    let states = [];
    let bookings = [];
    let selectedId = null;
    let tab = 'all';

    function tick() {
      const d = new Date();
      $('clock').innerHTML = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) +
        `<small>${d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })}</small>`;
    }

    function renderVenues() {
      $('venues').innerHTML = '';
      for (const r of restaurants) {
        const b = document.createElement('button');
        b.className = 'venue' + (r.id === current.id ? ' active' : '');
        b.innerHTML = `<span class="av" style="background:${r.cover}">${escapeHtml(r.name[0])}</span>
          <span><b>${escapeHtml(r.name)}</b><small>${escapeHtml(r.address)}</small></span>`;
        b.onclick = () => { current = r; selectedId = null; renderVenues(); load(); };
        $('venues').appendChild(b);
      }
    }

    async function load() {
      const [t, b] = await Promise.all([
        api(`/api/tables?restaurant=${current.id}`), // без даты — значит «сейчас»
        api(`/api/bookings?restaurant=${current.id}&date=${todayStr()}`),
      ]);
      states = t.tables;
      bookings = b.bookings;
      draw();
    }

    function draw() {
      $('title').textContent = current.name;
      renderHall($('hall'), current, {
        states,
        selected: selectedId,
        tipExtra: (t, s) => {
          const b = bookings.find((x) => x.id === s.bookingId);
          return b ? `${escapeHtml(b.name)} · ${b.guests} гост.` : '';
        },
        onSelect: (t) => { selectedId = t.id; draw(); },
      });
      const c = { free: 0, booked: 0, seated: 0 };
      states.forEach((s) => c[s.state]++);
      const n = states.length || 1;
      const pct = (x) => (x / n) * 100 + '%';
      $('stFree').textContent = c.free;
      $('stBooked').textContent = c.booked;
      $('stSeated').textContent = c.seated;
      $('stLoad').textContent = Math.round(((c.booked + c.seated) / n) * 100) + '%';
      $('bFree').style.width = pct(c.free);
      $('bBooked').style.width = pct(c.booked);
      $('bSeated').style.width = pct(c.seated);
      $('bLoadS').style.width = pct(c.seated);
      $('bLoadB').style.width = pct(c.booked);
      renderPanel();
      renderList();
    }

    function initials(name) {
      return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
    }

    function renderPanel() {
      const p = $('panel');
      const t = current.tables.find((x) => x.id === selectedId);
      if (!t) {
        p.innerHTML = `<h3>Стол не выбран</h3>
          <p class="muted" style="margin:6px 0 0;font-size:14px">Нажмите на стол на схеме, чтобы посадить гостей, отметить приход или освободить стол.</p>`;
        return;
      }
      const s = states.find((x) => x.id === t.id);
      const b = bookings.find((x) => x.id === s.bookingId);
      let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h3>Стол ${t.id}</h3>
          <span class="st-badge ${s.state}">${STATE_LABEL[s.state]}</span>
        </div>
        <div class="muted" style="font-size:14px;margin-top:2px">${escapeHtml(t.zone)} · ${t.seats} ${plural(t.seats, 'место', 'места', 'мест')}</div>`;
      if (b) {
        html += `<div class="guest">
          <div class="av">${escapeHtml(initials(b.name))}</div>
          <div><b>${escapeHtml(b.name)}</b>
          <small>${b.time} · ${b.guests} гост.${b.phone ? ' · ' + escapeHtml(b.phone) : ''}</small></div></div>`;
      } else {
        html += '<div style="height:14px"></div>';
      }
      html += '<div class="actions">';
      if (s.state === 'free') {
        html += `
          <div class="actions-row">
            <div class="stepper" style="flex:0 0 auto">
              <button type="button" id="wMinus">−</button><output id="wCount" style="min-width:64px">2 гост.</output><button type="button" id="wPlus">+</button>
            </div>
            <button class="btn blue" id="walkin">Посадить</button>
          </div>`;
      } else if (s.state === 'booked') {
        html += `<button class="btn blue" data-act="seated" data-id="${b.id}">Гости пришли</button>
                 <button class="btn soft-red" data-act="cancelled" data-id="${b.id}">Отменить бронь</button>`;
      } else {
        html += `<button class="btn" data-act="done" data-id="${b.id}">Освободить стол</button>`;
      }
      html += '</div><p class="error" id="err" style="margin-top:10px"></p>';
      p.innerHTML = html;

      if ($('walkin')) {
        let w = Math.min(2, t.seats);
        const upd = () => {
          $('wCount').textContent = `${w} гост.`;
          $('wMinus').disabled = w <= 1;
          $('wPlus').disabled = w >= t.seats;
        };
        upd();
        $('wMinus').onclick = () => { w--; upd(); };
        $('wPlus').onclick = () => { w++; upd(); };
        $('walkin').onclick = () => run(() => api('/api/walkin', {
          method: 'POST', body: { restaurantId: current.id, tableId: t.id, guests: w },
        }), 'Гости посажены');
      }
      p.querySelectorAll('[data-act]').forEach(bindAction);
    }

    function inTab(b, k) {
      if (k === 'all') return true;
      if (k === 'closed') return b.status === 'done' || b.status === 'cancelled';
      return b.status === k;
    }

    function renderList() {
      $('tabs').innerHTML = TABS.map(([k, label]) =>
        `<button class="${k === tab ? 'active' : ''}" data-tab="${k}">${label}<em>${bookings.filter((b) => inTab(b, k)).length}</em></button>`).join('');
      $('tabs').querySelectorAll('button').forEach((btn) => {
        btn.onclick = () => { tab = btn.dataset.tab; renderList(); };
      });

      const list = bookings.filter((b) => inTab(b, tab));
      const ul = $('list');
      if (!list.length) { ul.innerHTML = '<li class="empty">Здесь пока пусто</li>'; return; }
      ul.innerHTML = list.map((b) => `
        <li data-table="${b.tableId}">
          <span class="time">${b.time}</span>
          <span class="who"><b>${escapeHtml(b.name)}</b><small>Стол ${b.tableId} · ${b.guests} гост.</small></span>
          <span class="st-badge ${b.status}">${STATUS[b.status]}</span>
        </li>`).join('');
      ul.querySelectorAll('li[data-table]').forEach((li) => {
        li.onclick = () => { selectedId = li.dataset.table; draw(); };
      });
    }

    const ACT_MSG = { seated: 'Гости за столом', done: 'Стол свободен', cancelled: 'Бронь отменена' };
    function bindAction(btn) {
      btn.onclick = () => run(
        () => api(`/api/bookings/${btn.dataset.id}`, { method: 'PATCH', body: { status: btn.dataset.act } }),
        ACT_MSG[btn.dataset.act]
      );
    }

    async function run(fn, msg) {
      try {
        await fn();
        toast(msg);
        await load();
      } catch (e) {
        if ($('err')) $('err').textContent = e.message;
        else toast(e.message);
      }
    }

    async function init() {
      const data = await api('/api/restaurants');
      restaurants = data.restaurants;
      current = restaurants[0];
      renderVenues();
      tick();
      await load();
      onLiveUpdate((msg) => { if (msg.restaurantId === current.id) load(); });
      // раз в минуту обновляем часы и статусы (брони наступают по времени)
      setInterval(() => { tick(); load(); }, 60000);
    }
    init();
  </script>
</body>
</html>
